<section class="workspace-content">
    <header class="page-header">
        <h2>Translator</h2>
        <p> Translate your texts to any supported language. </p>
    </header>

    <div class="divider"></div>

    <!-- Language selectors -->
    <div class="translator-language-row">
        <div class="language-field">
            <label>Translate From</label>

            <div
                id="source-language-picker"
                class="language-picker"
            ></div>
        </div>

        <div class="language-arrow" aria-hidden="true">
            ⇀
        </div>

        <div class="language-field">
            <label>Translate To</label>

            <div
                id="target-language-picker"
                class="language-picker"
            ></div>
        </div>
    </div>

    <!-- Text Boxes -->
    <div class="translator-layout">

        <!-- Input -->
        <section class="input-section input-wrapper">
            <div class="text-block">
                <div class="text-block-header">
                    <label for="input-text">
                        <h3>Input Text</h3>
                    </label>

                    <button
                        id="clear-input-button"
                        class="delete-button"
                        type="button"
                        aria-label="Clear text"
                        title="Clear field" >
                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true">
                            <path d="M4 7h16"></path>
                            <path d="M9 7V4h6v3"></path>
                            <path d="M7 7l1 13h8l1-13"></path>
                            <path d="M10 11v5"></path>
                            <path d="M14 11v5"></path>
                        </svg>
                    </button>
                </div>

                <textarea
                    id="input-text"
                    class="text-input-vertical"
                    placeholder="Enter your text here..."
                ></textarea>
            </div>
        </section>

        <div class="translator-arrow-column" aria-hidden="true">
            <span class="translator-arrow">⇁</span>
        </div>

        <!-- Result -->
        <section class="result-section result-wrapper">
            <div class="result-header">
                <h3>Result</h3>

                <div class="result-actions">
                    <button
                        id="copy-result-button"
                        class="result-action-button"
                        type="button"
                        aria-label="Copy result"
                        title="Copy"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <rect
                                x="9"
                                y="9"
                                width="11"
                                height="11"
                                rx="2"
                            ></rect>

                            <path
                                d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"
                            ></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div
                id="result"
                class="result-box-vertical"
            ></div>
        </section>

    </div>

    <!-- Actions -->
    <div class="translator-actions">
        <button
            id="translate-button"
            class="primary-button"
            type="button">
            Translate
        </button>
    </div>
</section>
