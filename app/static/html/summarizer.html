<section class="workspace-content">
    <header class="page-header">
        <h2>Summarize Text</h2>
        <p>
            Create a concise summary of your text while preserving the key information.
        </p>
    </header>

    <div class="divider"></div>

    <!-- Input section -->
    <section class="input-section">

        <div class="text-block">
            <div class="text-block-header">
                <label for="input-text"><h3>Input Text</h3></label>
                <button
                    id="clear-input-button" 
                    class="delete-button"
                    type="button"
                    aria-label="Clear text"
                    title="Clear field">
                    
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 7h16"></path>
                        <path d="M9 7V4h6v3"></path>
                        <path d="M7 7l1 13h8l1-13"></path>
                        <path d="M10 11v5"></path>
                        <path d="M14 11v5"></path>
                    </svg>
                </button>
            </div>

            <textarea
                id="input-text"
                class="text-input"
                placeholder="Enter your text here..."
            ></textarea>
        </div>

        <!-- Actions -->
        <div class="action-row">
                <button
                    id="summarize-button"
                    class="primary-button"
                    type="button" >
                    Summarize
                </button>
            </div>
        </section>

        <div class="divider"></div>

    <!-- Result -->
    <section class="result-section">
        <div class="result-header">
            <h3>Result</h3>

            <div class="result-actions">
                <button
                    id="copy-result-button"
                    class="result-action-button"
                    type="button"
                    aria-label="Copy result"
                    title="Copy" >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect
                            x="9"
                            y="9"
                            width="11"
                            height="11"
                            rx="2"
                        ></rect>
                        <path
                            d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"
                        ></path>
                    </svg>
                </button>

                <button
                    id="download-result-button"
                    class="result-action-button"
                    type="button"
                    aria-label="Download result"
                    title="Download .txt" >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3v12"></path>
                        <path d="M7 10l5 5 5-5"></path>
                        <path d="M5 21h14"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div
            id="result"
            class="result-box"
        ></div>
    </section>
</section>
